meta:
  title: "LFM2.5 230M"
  slug: "lfm2.5-230m"
  provider: "LiquidAI"
  description: "Liquid AI's smallest LFM2.5 chat model (230M, distilled from 350M) on the LFM2 hybrid conv+attention backbone — tool calling and 128K context, built for on-device agentic and data-extraction tasks."
  date_updated: 2026-06-25
  difficulty: beginner
  tasks:
    - text
  performance_headline: "230M hybrid instruct model with tool calling — the smallest LFM2.5, for edge / on-device agentic pipelines"
  related_recipes:
    - LiquidAI/LFM2.5-350M
    - LiquidAI/LFM2.5-1.2B-Instruct
  hardware:
    h100: verified
    h200: verified
    b200: verified

model:
  model_id: "LiquidAI/LFM2.5-230M"
  min_vllm_version: "0.23.0"
  architecture: dense
  parameter_count: "230M"
  active_parameters: "230M"
  context_length: 128000
  base_args: []
  base_env: {}

features:
  tool_calling:
    description: "Surface LFM2.5's Pythonic tool calls (wrapped in <|tool_call_start|>…<|tool_call_end|>) as OpenAI tool_calls via vLLM's native lfm2 parser"
    args:
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "lfm2"

variants:
  default:
    precision: bf16
    vram_minimum_gb: 1
    description: "Full BF16 — fits essentially any GPU (~0.5 GB of weights)"

compatible_strategies:
  - single_node_tp

hardware_overrides:
  # Blackwell (B200) only: route RMSNorm to the bundled oink kernels (measured ~+2.6% on B200,
  # output identical). Inert (falls back to native) on non-Blackwell GPUs.
  blackwell:
    extra_env:
      VLLM_USE_OINK_OPS: "1"
strategy_overrides:
  single_node_tp:
    tp: 1

guide: |
  ## Overview

  [LFM2.5-230M](https://huggingface.co/LiquidAI/LFM2.5-230M) is the smallest chat model in
  [Liquid AI's](https://www.liquid.ai/) LFM2.5 family — distilled from LFM2.5-350M and refined
  with reinforcement learning for tool use and data extraction. It shares the LFM2 hybrid backbone
  (short-range gated convolution blocks + grouped-query attention) with its larger siblings, so it
  runs on essentially any GPU (and on-device) while still supporting tool calling and a 128K
  context window. It targets lightweight agentic / extraction pipelines, not reasoning-heavy work.

  vLLM supports it natively via the `Lfm2ForCausalLM` architecture.

  ### Key Features
  - **Tiny + distilled**: ~230M parameters distilled from LFM2.5-350M — the smallest LFM2.5 LM, for edge / on-device serving.
  - **Tool calling**: Pythonic tool calls (`<|tool_call_start|>…<|tool_call_end|>`) surfaced as OpenAI `tool_calls` by vLLM's native `lfm2` parser.
  - **Hybrid backbone**: Gated short convolutions interleaved with grouped-query attention — a smaller KV cache and lower decode latency than a same-size full-attention transformer.
  - **128K context**: Long-context support (`max_position_embeddings = 128000`).
  - **Native vLLM support**: Served via the `Lfm2ForCausalLM` architecture.

  ### Supported Variants

  Dense:
  - `LiquidAI/LFM2.5-230M` (230M)
  - `LiquidAI/LFM2.5-350M` (350M)
  - `LiquidAI/LFM2.5-1.2B-Instruct` (1.2B)
  - `LiquidAI/LFM2.5-1.2B-Thinking` (1.2B, reasoning)
  - `LiquidAI/LFM2.5-1.2B-JP` / `LiquidAI/LFM2.5-1.2B-JP-202606` (Japanese)
  - `LiquidAI/LFM2.5-1.2B-Base` (pretrained base)

  MoE:
  - `LiquidAI/LFM2.5-8B-A1B` (8B total / ~1B active)

  Vision-Language:
  - `LiquidAI/LFM2.5-VL-450M`, `LiquidAI/LFM2.5-VL-1.6B`

  See the [LFM2.5 usage guide](../../LiquidAI/LFM2.5) for the full family.

  ## Prerequisites

  - **Hardware**: 1× GPU (≈0.5 GB VRAM for weights; any modern GPU works).
  - **vLLM**: ≥ 0.23.0.

  ### pip (NVIDIA CUDA)
  ```bash
  uv venv
  source .venv/bin/activate
  uv pip install -U vllm --torch-backend auto
  ```

  ## Deployment Configurations

  ### Quick Start (Single GPU, BF16)
  ```bash
  vllm serve LiquidAI/LFM2.5-230M
  ```

  ### Full-Featured Server Launch
  Enables tool calling:
  ```bash
  vllm serve LiquidAI/LFM2.5-230M \
    --enable-auto-tool-choice \
    --tool-call-parser lfm2 \
    --host 0.0.0.0 --port 8000
  ```

  ### Docker (NVIDIA)
  ```bash
  docker run -itd --name lfm2.5-230m \
    --ipc=host --network host --shm-size 16G --gpus all \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    vllm/vllm-openai:latest \
      --model LiquidAI/LFM2.5-230M \
      --host 0.0.0.0 --port 8000
  ```

  ## Client Usage

  ### Text Generation
  Recommended sampling from the model card — temperature `0.1`, `top_k 50`,
  `repetition_penalty 1.05` (`top_k` / `repetition_penalty` ride in `extra_body`):
  ```python
  from openai import OpenAI

  client = OpenAI(base_url="http://localhost:8000/v1", api_key="EMPTY")
  resp = client.chat.completions.create(
      model="LiquidAI/LFM2.5-230M",
      messages=[{"role": "user", "content": "Extract the company and amount: 'Acme Corp invoiced $4,200.'"}],
      temperature=0.1,
      extra_body={"top_k": 50, "repetition_penalty": 1.05},
  )
  print(resp.choices[0].message.content)
  ```

  ### Tool Calling
  Launch with `--enable-auto-tool-choice --tool-call-parser lfm2`, then pass `tools=[…]`; the
  `lfm2` parser converts the model's Pythonic call into a standard `tool_calls` array.
  ```python
  resp = client.chat.completions.create(
      model="LiquidAI/LFM2.5-230M",
      messages=[{"role": "user", "content": "What's the weather in Paris?"}],
      tools=[{
          "type": "function",
          "function": {
              "name": "get_weather",
              "description": "Get current weather for a location",
              "parameters": {"type": "object", "properties": {"location": {"type": "string"}}, "required": ["location"]},
          },
      }],
      temperature=0.1,
      extra_body={"top_k": 50, "repetition_penalty": 1.05},
  )
  print(resp.choices[0].message.tool_calls)
  ```

  ## Configuration Tips
  - At 230M the model fits any GPU; raise `--max-num-seqs` to push batch throughput.
  - Best for data extraction and lightweight agentic pipelines — not reasoning-heavy tasks (math, code, creative writing).
  - Set `--max-model-len` to match your workload (up to 128K).
  - Sampling presets are per-request client defaults — don't bake them into `vllm serve`.

  ## References
  - [Model card](https://huggingface.co/LiquidAI/LFM2.5-230M)
  - [LFM2.5 usage guide](../../LiquidAI/LFM2.5)
  - [Liquid AI](https://www.liquid.ai/)
  - [vLLM supported models](https://docs.vllm.ai/en/latest/models/supported_models.html)
