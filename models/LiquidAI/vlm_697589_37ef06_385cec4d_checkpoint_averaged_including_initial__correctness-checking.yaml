meta:
  title: "LFM2.5 VL 3B"
  slug: "lfm2.5-vl-3b"
  provider: "LiquidAI"
  description: "Liquid AI's 3B vision-language model with an LFM2 hybrid language backbone and a SigLIP2 So400M vision tower."
  date_added: 2026-07-29
  date_updated: 2026-07-29
  difficulty: intermediate
  tasks:
    - multimodal
  performance_headline: "BF16 vision-language serving validated against Hugging Face on MI325X, H100, H200, and B200"
  related_recipes:
    - LiquidAI/LFM2.5-VL-1.6B
    - LiquidAI/LFM2.5-VL-450M
  hardware:
    h100: verified
    h200: verified
    b200: verified
    mi325x: verified

model:
  model_id: "LiquidAI/vlm_697589_37ef06_385cec4d_checkpoint_averaged_including_initial__correctness-checking"
  min_vllm_version: "0.23.1"
  nightly_required: true
  docker_image:
    nvidia: "vllm/vllm-openai@sha256:adf39421281d0874b5ac8d1665ea0e32ae6650a5615b29a99bd97d2aca23ae40"
    amd: "rocm/vllm-dev:nightly"
  architecture: dense
  parameter_count: "3B"
  active_parameters: "3B"
  context_length: 32768
  base_args:
    - "--trust-remote-code"
    - "--dtype bfloat16"
