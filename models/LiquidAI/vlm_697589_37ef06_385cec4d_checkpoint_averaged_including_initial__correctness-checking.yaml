meta:
  title: "LFM2.5 VL 3B"
  slug: "lfm2.5-vl-3b"
  provider: "LiquidAI"
  description: "Liquid AI's 3B vision-language model with an LFM2 hybrid language backbone and a SigLIP2 So400M vision tower."
  date_added: 2026-07-29
  date_updated: 2026-07-29
  difficulty: intermediate
  tasks:
    - multimodal
  performance_headline: "BF16 vision-language serving downstream-validated on MI325X, H100, H200, and B200"
  related_recipes:
    - LiquidAI/LFM2.5-VL-1.6B
    - LiquidAI/LFM2.5-VL-450M
  hardware:
    h100: verified
    h200: verified
    b200: verified
