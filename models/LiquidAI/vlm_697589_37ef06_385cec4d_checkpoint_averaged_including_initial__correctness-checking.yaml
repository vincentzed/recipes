variants:
  default:
    precision: bf16
    vram_minimum_gb: 8
    description: "BF16 language model and vision encoder; the only validated launch precision"

compatible_strategies:
  - single_node_tp

hardware_overrides:
  blackwell:
    extra_args:
      - "--attention-backend FLASH_ATTN"
      - "--attention-config.flash_attn_version 4"
  amd:
    extra_args:
      - "--max-model-len 32768"
      - "--gpu-memory-utilization 0.85"

strategy_overrides:
  single_node_tp:
    tp: 1

guide: |
  ## Overview

  LFM2.5-VL-3B combines an LFM2 hybrid language backbone with a SigLIP2
  So400M vision encoder. It supports text-only, single-image, and multi-image
  OpenAI-compatible chat requests. The configurations on this page are BF16
  only and were tested end-to-end against the Hugging Face implementation.

  This recipe uses the exact qualification checkpoint
  `LiquidAI/vlm_697589_37ef06_385cec4d_checkpoint_averaged_including_initial__correctness-checking`.
  Its recipe path matches that Hugging Face repository ID.
  The owner-locked `LFM2-VL-3B-public` configuration could not be read during
  qualification; rerun the published regression harness on the exact final
  artifact when its repository and revision are provided.

  ## Validated runtime

  - NVIDIA: vLLM `0.23.1rc1.dev301+g04c2a8dea`, official nightly image
    digest `sha256:adf39421281d0874b5ac8d1665ea0e32ae6650a5615b29a99bd97d2aca23ae40`.
  - AMD MI325X: vLLM HEAD commit `32a423ac`, `rocm/vllm-dev:nightly`.
  - Tensor parallelism: TP=1. The 3B model fits on one GPU. H100 TP=2 was
    not downstream-eval-qualified; its ordinary 1500×730 and long-image HF
    diagnostics reached `0.7538` and `0.5112` maximum prefill delta. TP=1 is
    the downstream-validated topology and avoids doubling hardware for a
    model that fits one GPU.
  - Precision: BF16 only.

  ## Launch

  ### H100 and H200

  SGLang's multimodal feature-transport IPC variables are not applicable to
  vLLM; no corresponding frontend transport flag is required.

  ```bash
  docker run --rm --gpus all --ipc=host --network host \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    -e HF_TOKEN \
    vllm/vllm-openai@sha256:adf39421281d0874b5ac8d1665ea0e32ae6650a5615b29a99bd97d2aca23ae40 \
      --model LiquidAI/vlm_697589_37ef06_385cec4d_checkpoint_averaged_including_initial__correctness-checking \
      --served-model-name default \
      --trust-remote-code --dtype bfloat16 \
      --max-model-len 8192 --gpu-memory-utilization 0.72
  ```

  ### B200

  Use FlashAttention 4 on Blackwell. An earlier nightly produced a
  diagnostic-only `0.640996` maximum long-prefill log-probability delta, but
  the launch gate is downstream accuracy: the current official nightly
  scored `85.4209446%` on all 487 canonical CountBench examples with zero
  inference failures. In the corrected unique-image/cache-off workload it
  reached `2115±22.13` completion tokens/s at C=32.
  SGLang's feature-transport IPC variables are not applicable.

  ```bash
  docker run --rm --gpus all --ipc=host --network host \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    -e HF_TOKEN \
    vllm/vllm-openai@sha256:adf39421281d0874b5ac8d1665ea0e32ae6650a5615b29a99bd97d2aca23ae40 \
      --model LiquidAI/vlm_697589_37ef06_385cec4d_checkpoint_averaged_including_initial__correctness-checking \
      --served-model-name default \
      --trust-remote-code --dtype bfloat16 \
      --max-model-len 8192 --gpu-memory-utilization 0.72 \
      --attention-backend FLASH_ATTN \
      --attention-config.flash_attn_version 4
  ```

  ### AMD MI325X

  vLLM does not use SGLang's processor-to-scheduler feature transport, so
  `SGLANG_USE_CUDA_IPC_TRANSPORT` and its pool-handle cache are N/A here.

  ```bash
  docker run --rm --device=/dev/kfd --device=/dev/dri \
    --group-add video --ipc=host --network host \
    -v ~/.cache/huggingface:/root/.cache/huggingface \
    -e HF_TOKEN \
    rocm/vllm-dev:nightly \
      --model LiquidAI/vlm_697589_37ef06_385cec4d_checkpoint_averaged_including_initial__correctness-checking \
      --served-model-name default \
      --trust-remote-code --dtype bfloat16 \
      --max-model-len 32768 --gpu-memory-utilization 0.85
  ```

  ## Correctness

  Qualification used canonical downstream evaluation accuracy as the
  acceptance gate. Teacher-forced actual-token log probabilities were also
  compared with Hugging Face at multiple image resolutions, including a
  6,931-token long-image prefill, as a localization diagnostic.

  | GPU | Maximum prefill delta | Maximum decode delta | Result |
  |---|---:|---:|---|
  | MI325X | 0.4320 | 0.0988 | PASS |
  | H100 | 0.359605 | 0.114745 | PASS |
  | H200 | 0.359605 | 0.086317 | PASS |
  | B200, FlashAttention 4 | 0.389338 | 0.087213 | PASS diagnostic |

  The B200 FlashAttention 4 downstream gate is CountBench `0.854209446`
  (416/487), matching the canonical same-checkpoint reference.

  ## Performance

  ### Canonical LFM2.5 cookbook methodology

  The primary table uses the exact established cookbook cells: `vllm bench
  serve`, random input/output caps 1024/1024, C=1 with 10 prompts and C=100
  with 1000 prompts. Current `random_range_ratio=0.0` samples request lengths
  uniformly from 1 through each cap.

  | GPU | C=1 total tok/s | C=100 total tok/s | Mean TTFT (C1 / C100) | Mean TPOT (C1 / C100) |
  |---|---:|---:|---:|---:|
  | H100 | 613.68 | 33722.53 | 224.70 / 617.36 ms | 3.04 / 5.33 ms |
  | H200 | 767.21 | 37646.85 | 193.35 / 573.93 ms | 2.42 / 4.75 ms |
  | B200, FlashAttention 4 | 510.31 | 38187.62 | 1813.17 / 380.16 ms | 2.15 / 4.87 ms |
  | MI325X | 692.75 | 28592.70 | 12.39 / 56.70 ms | 2.68 / 6.53 ms |

  Exact reproduction:

  ```bash
  for cell in 1:10 100:1000; do
    concurrency=${cell%%:*}
    prompts=${cell##*:}
    vllm bench serve --backend vllm \
      --host localhost --port 8000 \
      --model LiquidAI/vlm_697589_37ef06_385cec4d_checkpoint_averaged_including_initial__correctness-checking \
      --dataset-name random \
      --random-input-len 1024 --random-output-len 1024 \
      --num-prompts "$prompts" --max-concurrency "$concurrency"
  done
  ```

  The exact command does not insert a synthetic warmup. The B200 C1 cell
  therefore includes first-request compilation rather than replacing it
  with a differently warmed number. The exact cookbook MMMU sampling command
  (900 examples, 128 threads, max 2048, temperature 0.1, min-p 0.15) scores
  `41.4467%` on the MI325X vLLM endpoint. This stochastic recipe score is
  distinct from the temperature-zero downstream gate.

  ### Image-serving launch methodology

  The publishable image benchmark uses `tokenomics==0.9.0` plus an audited
  wrapper: a different deterministic 512×512 image for every request, 268
  actual prompt tokens, 32 generated tokens, temperature zero, 128 prompts
  per cell, one warmup, and three measured runs. Every row completed 2,304
  requests with 2,304 distinct measured image hashes. Values are mean
  completion tokens/s ± population standard deviation.

  | GPU / vLLM version / image / cache | C=1 | C=2 | C=4 | C=8 | C=16 | C=32 |
  |---|---:|---:|---:|---:|---:|---:|
  | H100 / `0.23.1rc1.dev301+g04c2a8dea` / official nightly / `--mm-processor-cache-gb 0` | 279.0±2.437 | 450.2±8.014 | 773.9±8.256 | 1121±17.42 | 1418±23.64 | 1753±20.41 |
  | H200 / same / cache 0 | 278.9±0.972 | 463.7±8.462 | 770.5±7.232 | 1139±7.761 | 1468±10.86 | 1747±26.02 |
  | B200 / same / FlashAttention 4 / cache 0 | 302.4±1.287 | 479.4±6.689 | 806.5±39.72 | 1248±110.6 | 1756±37.98 | 2115±22.13 |
  | MI325X / `0.23.1rc1.dev1120+g0f0f28b53` / `rocm/vllm-dev:nightly-20260731` / default 4 GiB, zero measured hits | 304.9±1.143 | 526.7±1.198 | 883.6±4.704 | 1300±39.43 | 2080±21.37 | 2771±19.69 |

  The earlier NVIDIA numbers are superseded because they repeated one image
  while vLLM's processor cache was on and SGLang's vision cache was off.
  A persistent-cache-off repeated-image control changed vLLM C32 by only
  `+0.2%/+3.9%/-0.5%/+1.6%` on H100/H200/B200/MI325X. The unique-image
  rows above are the serving comparison; the control is not published as a
  workload result.

  ## API validation

  The launch configuration passed text-only, single-image, multi-image,
  streaming/non-streaming parity, deterministic concurrent requests, and
  malformed-image recovery. Use `--limit-mm-per-prompt '{"image": N}'` if
  an application needs an explicit multi-image cap.

  A 2,048-text plus 2,048-image request soak at C=32 on MI325X produced one
  byte-identical output per workload, survived a malformed-image request,
  and changed used VRAM by less than 6 MB. H100 TP=2 also passed the API
  robustness checks; it was not downstream-eval-qualified and is not a
  launch configuration.

  ## References

  - [LFM2.5 recipes](../../LiquidAI/LFM2.5)
  - [vLLM supported models](https://docs.vllm.ai/en/latest/models/supported_models.html)
