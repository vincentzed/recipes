model:
  model_id: "LiquidAI/vlm_697589_37ef06_385cec4d_checkpoint_averaged_including_initial__correctness-checking"
  min_vllm_version: "0.23.1"
  nightly_required: true
  docker_image:
    nvidia: "vllm/vllm-openai@sha256:adf39421281d0874b5ac8d1665ea0e32ae6650a5615b29a99bd97d2aca23ae40"
    amd: "rocm/vllm-dev:nightly"
  architecture: dense
  parameter_count: "3B"
  active_parameters: "3B"
  context_length: 32768
  base_args:
    - "--trust-remote-code"
    - "--dtype bfloat16"
